<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leitor de tickets</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#14181c;color:#fff;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
#topo{padding:6px 12px;display:flex;justify-content:space-between;font-size:13px;background:#0e1114}
#camera{position:relative;height:34dvh;background:#000;flex:none}
video{width:100%;height:100%;object-fit:cover;display:block}
#moldura{position:absolute;inset:5% 3%;border:3px solid #fff;border-radius:10px;transition:.2s}
#moldura.lido{border-color:#0c6;background:rgba(0,200,100,.2)}#moldura.parcial{border-color:#fc0}
#estado{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-weight:bold;font-size:13px;text-shadow:0 0 4px #000}
#ativar{margin:10px auto;padding:14px 28px;font-size:16px;border:0;border-radius:8px;background:#0c6;font-weight:bold}
#erro{color:#f88;font-size:13px;padding:0 12px}
#painel{flex:1;overflow-y:auto;padding:8px 10px 12px}
#acoes{display:flex;gap:8px;margin-bottom:8px}
#acoes button{flex:1;padding:12px;font-weight:bold;border:0;border-radius:8px;color:#fff;background:#4a5560}
#enviar{background:#0b8f4d!important}#enviar:disabled{background:#2a3138!important;color:#667}
#campos{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.campo{background:#1d242b;border-radius:8px;padding:6px 8px;border-left:4px solid #3a444d}
.campo.ok{border-color:#0c6}.campo.palpite{border-color:#fc0}
.campo.principal{grid-column:1/-1;background:#1a2a22;border-left-width:6px}
.campo small{display:block;font-size:10px;text-transform:uppercase;color:#8a97a3}
.campo input{width:100%;background:none;border:0;color:#eafff3;font-size:15px;font-weight:600;padding:0;outline:none}
.principal input{font-size:26px;letter-spacing:.12em}
#aviso{display:none;background:#1a2a22;border:1px solid #0b8f4d;border-radius:8px;padding:10px;margin-bottom:8px;font-size:13px;color:#a8e6c3}
#lista div{padding:6px 2px;border-bottom:1px solid #333;font-size:13px}
</style>
</head>
<body>
<div id="topo"><span id="contador">Lidos: 0</span><span id="status">Toque em Ativar câmera</span></div>
<div id="camera"><video id="video" autoplay playsinline muted></video><div id="moldura"></div><div id="estado">Aponte o ticket para a moldura</div></div>
<button id="ativar">Ativar câmera</button><div id="erro"></div>
<div id="painel">
  <div id="aviso">Confira o <b>Nº do Pedido</b> (pode corrigir digitando) e toque em <b>Enviar</b>.</div>
  <div id="acoes"><button id="enviar" disabled>Enviar</button><button id="limpar">Limpar leitura</button></div>
  <div id="campos"></div>
  <div id="lista"></div>
</div>
<script>
// ====== AJUSTE AQUI ======
const API = 'https://SEU-BACKEND.onrender.com';
const TOKEN = 'troque-por-um-token';
const INTERVALO_MS = 400, VAZIOS_PARA_RESET = 3;
// =========================
const ROT = {pedido:'Nº do Pedido',atendimento:'Atendimento',pacs:'PACS',exame:'Nº Exame',nascimento:'Nascimento',sexo:'Sexo',dataAtend:'Data atend.',dataAgenda:'Data agenda',convenio:'Convênio',plano:'Plano',exameNome:'Exame'};
const $ = id => document.getElementById(id);
const inp = k => document.querySelector(`input[data-k="${k}"]`);
let sessao = crypto.randomUUID(), travado = false, vazios = 0, lidos = 0, editando = false;

for (const k in ROT) {
  const d = document.createElement('div');
  d.className = 'campo' + (k === 'pedido' ? ' principal' : ''); d.id = 'c-' + k;
  d.innerHTML = `<small>${ROT[k]}</small><input data-k="${k}" placeholder="—" autocomplete="off"${k==='pedido'?' inputmode="numeric"':''}>`;
  $('campos').appendChild(d);
}
const validoPedido = () => /^\d{6,8}$/.test(inp('pedido').value.trim());
$('campos').addEventListener('input', () => $('enviar').disabled = !validoPedido());
inp('pedido').addEventListener('focus', () => editando = true);
inp('pedido').addEventListener('blur', () => editando = false);

const audio = new (window.AudioContext || window.webkitAudioContext)();
function bipe() { const o = audio.createOscillator(), g = audio.createGain(); o.connect(g); g.connect(audio.destination); o.frequency.value = 1000; g.gain.value = .2; o.start(); o.stop(audio.currentTime + .15); }

function recorte() {
  const v = $('video'), rv = v.getBoundingClientRect(), rm = $('moldura').getBoundingClientRect();
  const e = Math.max(rv.width / v.videoWidth, rv.height / v.videoHeight);
  const ox = (v.videoWidth * e - rv.width) / 2, oy = (v.videoHeight * e - rv.height) / 2;
  const sx = (rm.left - rv.left + ox) / e, sy = (rm.top - rv.top + oy) / e, sw = rm.width / e, sh = rm.height / e;
  const c = document.createElement('canvas'), f = Math.min(1, 1200 / sw);
  c.width = sw * f; c.height = sh * f;
  c.getContext('2d').drawImage(v, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, 'image/jpeg', .85));
}

function reiniciar() {
  sessao = crypto.randomUUID(); travado = false; vazios = 0;
  $('moldura').className = ''; $('estado').textContent = 'Aponte o próximo ticket'; $('aviso').style.display = 'none';
  for (const k in ROT) { inp(k).value = ''; $('c-' + k).className = 'campo' + (k === 'pedido' ? ' principal' : ''); }
  $('enviar').disabled = true;
}

function mostrar(d) {
  if (d.vazio) { if (++vazios >= VAZIOS_PARA_RESET) reiniciar(); return; }
  vazios = 0;
  const p = d.pedido;
  if (!editando) inp('pedido').value = p.texto;
  $('c-pedido').className = 'campo principal ' + (p.completo ? 'ok' : 'palpite');
  for (const k in d.campos) if (k !== 'pedido' && document.activeElement !== inp(k)) { inp(k).value = d.campos[k]; $('c-' + k).className = 'campo ok'; }
  $('enviar').disabled = !validoPedido();
  if (p.completo) {
    travado = true; bipe(); navigator.vibrate && navigator.vibrate(80);
    $('moldura').className = 'lido'; $('estado').textContent = '✅ Pedido lido — confira e envie'; $('aviso').style.display = 'block';
  } else { $('moldura').className = 'parcial'; $('estado').textContent = 'Lendo... ' + p.texto; }
}

async function loop() {
  if (!travado && !editando && $('video').videoWidth) {
    try {
      const fd = new FormData(); fd.append('sessao', sessao); fd.append('imagem', await recorte(), 'q.jpg');
      const r = await fetch(API + '/ocr', { method: 'POST', headers: { 'X-Token': TOKEN }, body: fd });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      $('erro').textContent = ''; mostrar(await r.json());
    } catch (e) { $('erro').textContent = 'Backend: ' + e.message; }
  }
  setTimeout(loop, INTERVALO_MS);
}

$('enviar').onclick = async () => {
  const campos = {}; for (const k in ROT) { const v = inp(k).value.trim(); if (v) campos[k] = v; }
  const item = document.createElement('div'); item.textContent = '⏳ ' + campos.pedido; $('lista').prepend(item);
  $('enviar').disabled = true;
  try {
    const r = await fetch(API + '/enviar', { method: 'POST', headers: { 'X-Token': TOKEN, 'Content-Type': 'application/json' }, body: JSON.stringify({ campos, texto: '' }) });
    const j = await r.json(); if (!r.ok) throw new Error(j.detail || r.status);
    if (j.duplicado) item.textContent = '⚠️ ' + campos.pedido + ' (já estava na planilha)';
    else { item.textContent = '✔ ' + campos.pedido; $('contador').textContent = 'Lidos: ' + (++lidos); }
    bipe(); reiniciar();
  } catch (e) { item.textContent = '❌ ' + campos.pedido + ' (' + e.message + ')'; $('enviar').disabled = false; }
};
$('limpar').onclick = reiniciar;

$('ativar').onclick = async () => {
  try {
    $('video').srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    await $('video').play(); $('ativar').style.display = 'none'; audio.resume();
    $('status').textContent = 'Pronto — aponte o ticket'; loop();
  } catch (e) { $('erro').textContent = 'Câmera indisponível: ' + e.message; }
};
</script>
</body>
</html>
